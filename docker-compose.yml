name: vagas-bot

services:
  mongo:
    image: mongo:8
    container_name: vagas-mongo
    restart: unless-stopped
    environment:
      # Usuário root do Mongo. Só vale na PRIMEIRA vez (volume vazio).
      # Para trocar depois: docker compose down -v
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-vagas}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Defina MONGO_PASSWORD no arquivo .env}
      TZ: America/Sao_Paulo
    ports:
      # Só acessível a partir do seu computador (não expõe na rede)
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - vagas-mongodata:/data/db
    healthcheck:
      # ping não exige login; sai com 1 se o servidor não responder ok
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: vagas-rabbitmq
    # Hostname fixo: o RabbitMQ guarda os dados por nome do nó.
    # Sem isso, recriar o container "perde" filas e mensagens.
    hostname: vagas-rabbitmq
    restart: unless-stopped
    environment:
      # Só valem na PRIMEIRA vez (volume vazio). Para trocar depois: docker compose down -v
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-vagas}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"             # AMQP (Java e Python)
      - "127.0.0.1:${RABBITMQ_PAINEL_PORT:-15672}:15672"    # painel web
    volumes:
      - vagas-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 10

  # core-java: entra na etapa 2 (declara as filas e consome)
  # scraper-python: entra na etapa 7 (publica na fila)

volumes:
  vagas-mongodata:
  vagas-rabbitmq:
