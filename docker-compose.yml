name: vagas-bot

services:
  postgres:
    image: postgres:17
    container_name: vagas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vagas}
      POSTGRES_USER: ${POSTGRES_USER:-vagas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      # Só acessível a partir do seu computador (não expõe na rede)
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vagas-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # core-java: entra na etapa 2

volumes:
  vagas-pgdata:
