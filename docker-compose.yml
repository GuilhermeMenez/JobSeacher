name: vagas-bot

services:
  postgres:
    image: postgres:17
    container_name: vagas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vagas}
      POSTGRES_USER: ${POSTGRES_USER:-vagas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      # Só acessível a partir do seu computador (não expõe na rede)
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vagas-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: vagas-rabbitmq
    # Hostname fixo: o RabbitMQ guarda os dados por nome do nó.
    # Sem isso, recriar o container "perde" filas e mensagens.
    hostname: vagas-rabbitmq
    restart: unless-stopped
    environment:
      # Só valem na PRIMEIRA vez (volume vazio). Para trocar depois: docker compose down -v
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-vagas}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"             # AMQP (Java e Python)
      - "127.0.0.1:${RABBITMQ_PAINEL_PORT:-15672}:15672"    # painel web
    volumes:
      - vagas-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 10

  # core-java: entra na etapa 2 (declara as filas e consome)
  # scraper-python: entra na etapa 7 (publica na fila)

volumes:
  vagas-pgdata:
  vagas-rabbitmq:
